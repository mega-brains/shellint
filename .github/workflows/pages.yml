name: Deploy shellint static site

# M17.8 — builds offline device-less shellint (scripts/build-static.mjs)
# and publishes site/ to GitHub Pages. Independent of the server build; this
# workflow never touches web/dist/ or dist/.
#
# M27 §7.2 — gated on CI rather than triggered by the push directly, so a red
# main cannot publish. `workflow_run` was chosen over inlining part of the gate
# here: re-running even the cheap half would duplicate work CI has already done,
# and inlining the full one would double the e2e cost for no extra signal.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment in flight at a time; a newer push cancels an
# in-progress older one rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A `workflow_run` fires on failure too, so the conclusion has to be
    # checked explicitly. `workflow_dispatch` has no source run and must still
    # be allowed through.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # COLLECTOR_ORIGIN is a repository *variable* (Settings → Secrets and
      # variables → Actions → Variables), not a secret: it is baked into the
      # published HTML as a `<script src>` any visitor can read, so hiding it
      # would be theatre. It is kept out of the tree only so the source does not
      # advertise the host. Unset — the default, and every fork — builds the
      # site with no beacon at all; see withBeacon() in build-static.mjs.
      - run: npm run build:static
        env:
          SHELLINT_REPO: ${{ github.repository }}
          COLLECTOR_ORIGIN: ${{ vars.COLLECTOR_ORIGIN }}
          COLLECTOR_SITE_ID: ${{ vars.COLLECTOR_SITE_ID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
