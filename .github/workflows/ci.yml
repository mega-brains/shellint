name: CI

# M27 — the full local gate, on both runners. See
# .claude/plans/2026-08-18_27_ci-deploy.md.
#
# One `run:` for the whole gate, deliberately: `pnpm run beforeCommit` is the
# same chain a developer runs (oxlint → check:lines → typecheck → build:gate →
# build:static → test → test:e2e → test:e2e:txiki), so there is no CI-only test
# list to drift out of sync with it.
#
# Neither e2e suite touches a device — device-switch.spec.ts and
# probe-required.spec.ts mock, and the gate compiles fixtures/device/main.ts in
# a per-runner .tmp/ workspace, never scripts/main.ts. So CI is safe without
# hardware and cannot write to anyone's Shelly.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/setup-tjs
        with:
          node-version: ""   # already set up above

      # `chromium-headless-shell`, not `chromium`: the suite only runs headless,
      # so the full download is never launched. PW_CHANNEL=bundled below selects
      # it — e2e/helpers/browser-channel.ts otherwise falls back to system
      # Chrome, which no runner ships, so the opt-in stays explicit.
      - run: pnpm exec playwright install --with-deps chromium-headless-shell

      - run: pnpm run beforeCommit
        env:
          PW_CHANNEL: bundled
          SHELLINT_REPO: ${{ github.repository }}

      # Screenshot diffs are unreadable from logs; design.spec.ts failures are
      # only diagnosable from the report.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
