name: Release

# M27 §8 — one single-file native executable per platform, zipped and attached
# to a **draft** release for a human to publish. See
# .claude/plans/2026-08-18_27_ci-deploy.md.
#
# Every asset ships as `<asset>.zip` holding one file — `shellint`, or
# `shellint.exe` on Windows. A bare binary served over HTTPS is what browsers
# and macOS treat worst: Safari strips the exec bit, and both macOS and Windows
# tag the download itself with quarantine/MoTW. A zip keeps the executable bit
# on unix and gives Windows users something Explorer can open. The build,
# size-assert and standalone smoke run all still happen on the *raw* binary —
# zipping is the last step before checksumming.
#
# Matrix note: macOS x64 is deliberately absent. The slim release publishes no
# macOS x86_64 asset in any profile, so that row could only ship the ~5.6 MB
# upstream full build and would falsify the download page's "Under 5 MB".
# Windows takes its place — both halves exist and compile-txiki.mjs already
# emits shellint.exe — but has never been run anywhere; treat a Windows failure
# as an unproven row, not a regression, and drop it rather than fight it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   asset: shellint-macos-arm64,   bin: shellint }
          - { os: ubuntu-latest,  asset: shellint-linux-x64,     bin: shellint }
          - { os: windows-latest, asset: shellint-windows-x64,   bin: shellint.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/setup-tjs
        with:
          node-version: ""

      # The executable embeds web/dist, so the web bundle has to exist first.
      - run: npm run build:web
      - run: npm run build:txiki:executable

      - name: Stage the binary
        run: mv ".txiki/${{ matrix.bin }}" "${{ matrix.bin }}"

      # The download page's headline is "One file. No Node. Under 5 MB." A
      # silent creep past that turns the page into a lie, so it fails the build.
      # macOS arm64 measured 4,506,881 B on 2026-08-25 — ~11% of margin, not
      # much.
      - name: Assert size under 5 MB
        run: |
          bytes=$(wc -c < "${{ matrix.bin }}")
          echo "${{ matrix.asset }}: $bytes bytes"
          if [ "$bytes" -gt 5242880 ]; then
            echo "::error::${{ matrix.asset }} is $bytes bytes, over the 5 MB claim"
            exit 1
          fi

      # A binary that does not start is worse than no release — and one that
      # starts but cannot show its UI is what v0.0.2 actually shipped.
      #
      # Runs from an **empty directory outside the checkout**, with no env
      # overrides, because that is the only shape that tests what a user
      # downloads. The old version ran in the repo root with SHELLINT_SCRIPT
      # pointed at a scratch path, so it passed while `/` was answering
      # `web/index.html missing` (500) and startup was crashing with ENOENT
      # anywhere else: web/, templates/ and types/ were all being read out of
      # the checkout it happened to be standing in.
      #
      # Asserting `/` serves HTML is the specific regression guard; /api/build
      # proves the embedded types/*.d.ts materialised and the device compile ran.
      - name: Smoke-run the executable standalone
        run: |
          chmod +x "${{ matrix.bin }}"
          bin="$PWD/${{ matrix.bin }}"
          smoke="$(mktemp -d)"
          cd "$smoke"
          SHELLINT_PORT=8791 "$bin" &
          pid=$!
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8791/api/checks; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::${{ matrix.asset }} did not boot in an empty dir within 30s"
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          fail=0
          body=$(curl -fsS http://127.0.0.1:8791/ || true)
          case "$body" in
            *"<!DOCTYPE html>"*) echo "  / serves the embedded UI" ;;
            *) echo "::error::/ did not serve HTML (got: $(printf '%s' "$body" | head -c 80))"; fail=1 ;;
          esac
          for route in /app.js /styles.css /api-docs.json; do
            if curl -fsS -o /dev/null "http://127.0.0.1:8791$route"; then
              echo "  $route ok"
            else
              echo "::error::$route did not serve from the embedded assets"; fail=1
            fi
          done
          if curl -fsS -o /dev/null -X POST http://127.0.0.1:8791/api/build; then
            echo "  /api/build compiled a device script"
          else
            echo "::error::/api/build failed — embedded types/*.d.ts likely missing"; fail=1
          fi
          kill "$pid" 2>/dev/null || true
          exit $fail

      # Info-ZIP `zip` is the only one of these that stores the unix executable
      # bit, and it is present on the macOS and Linux runners but not in
      # Windows' Git Bash — there 7-Zip (preinstalled on the runner) does, and
      # the exec bit is meaningless on Windows anyway. One file per archive,
      # stored flat: `unzip shellint-macos-arm64.zip` yields `shellint`.
      - name: Zip the executable
        run: |
          if command -v zip >/dev/null 2>&1; then
            zip -q -X "${{ matrix.asset }}.zip" "${{ matrix.bin }}"
          else
            7z a -tzip -bso0 -bsp0 "${{ matrix.asset }}.zip" "${{ matrix.bin }}"
          fi
          ls -l "${{ matrix.asset }}.zip"

      # Windows' Git Bash ships sha256sum but no shasum; macOS ships shasum but
      # no sha256sum. Neither name is portable on its own — this step failed the
      # whole Windows row once with `shasum: command not found`, after the
      # binary had already built, passed the size assert and served a request.
      - name: Checksum
        run: |
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.asset }}.zip" > "${{ matrix.asset }}.zip.sha256"
          else
            sha256sum "${{ matrix.asset }}.zip" > "${{ matrix.asset }}.zip.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.zip.sha256
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # draft: true — the macOS and Windows binaries are unsigned, so the
      # release notes have to carry the Gatekeeper/SmartScreen workaround before
      # anyone sees them. Publishing stays a human act.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/shellint-*
          fail_on_unmatched_files: true
