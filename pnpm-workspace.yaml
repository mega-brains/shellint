# pnpm 11 defaults strictDepBuilds=true and reads settings here, not package.json.
# These dependencies compile native bindings or resolve a platform binary.
#
# The list is the union across platforms, not just what this machine installs:
# noble's transport dependency is platform-split, so macOS pulls xpc-connection
# while Linux pulls bluetooth-hci-socket and usb. A list generated on one OS
# fails --frozen-lockfile on the other.
#
# `false` is a decision, not an omission — strictDepBuilds is satisfied either
# way, so a dependency we deliberately never build belongs here explicitly.
allowBuilds:
  "@abandonware/bluetooth-hci-socket": true
  "@abandonware/noble": true
  "@serialport/bindings-cpp": true
  "bluetooth-hci-socket": true
  "bufferutil": true
  "es5-ext": true
  "esbuild": true
  "usb": true
  "usocket": true
  "utf-8-validate": true
  "wrtc": true
  # nan-based and does not compile against Node 24's V8 (`Set` arity changed),
  # so allowing the build fails every `pnpm run` on macOS. It is noble's BLE
  # transport, reached only via espruino -> noble-winrt -> noble; shellint shells
  # out to `espruino --minify`, which never opens a radio. Left unbuilt on purpose.
  "xpc-connection": false
