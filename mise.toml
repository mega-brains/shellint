[tools]
node = "22"

[tasks.install]
description = "Install npm dependencies"
run = "npm install"

[tasks.start]
description = "Start DevRoom server (host/port from devroom.json)"
alias = "dev"
run = "npm run dev"

[tasks."build:shelly"]
description = "Build Shelly dual artifacts"
run = "npm run build:shelly"

[tasks."build:web"]
description = "Build web UI bundle"
run = "npm run build:web"

[tasks.build]
description = "Build Shelly dual artifacts + web UI bundle (parallel)"
depends = ["build:shelly", "build:web"]

[tasks.deploy]
description = "Build then deploy (MODE=debug|prod, MINIFY=min|raw)"
# Usage: mise run deploy -- debug min   OR   MODE=prod MINIFY=raw mise run deploy
run = """
mode="${1:-${MODE:-debug}}"
minify="${2:-${MINIFY:-min}}"
npm run build:shelly
npm run deploy -- --mode "$mode" --minify "$minify"
"""

[tasks.lint]
description = "Typecheck Shelly script + server + web"
depends = ["typecheck"]

[tasks."typecheck:shelly"]
description = "Typecheck Shelly script"
run = "npm run typecheck:shelly"

[tasks."typecheck:server"]
description = "Typecheck server"
run = "npm run typecheck:server"

[tasks."typecheck:web"]
description = "Typecheck web"
run = "npm run typecheck:web"

[tasks.typecheck]
description = "Typecheck Shelly script + server + web (parallel)"
depends = ["typecheck:shelly", "typecheck:server", "typecheck:web"]

[tasks."check:lines"]
description = "Fail if any .ts/.tsx/.js/.mjs/.mts/.css source exceeds 500 lines"
run = "npm run check:lines"

[tasks.test]
description = "Shelly DCE/minify asserts + web bundle + server smoke"
run = "npm run test"

[tasks."test:e2e"]
description = "Playwright e2e (Chromium) against local DevRoom UI"
run = "npm run test:e2e"

[tasks.b]
alias="beforeCommit"
description = "Pre-commit gate: line limit + typecheck + build run in parallel, then test, then e2e"
depends = ["check:lines", "typecheck", "build"]
run = """
npm run test
npm run test:e2e
"""

[tasks.probe]
description = "Run Script.Eval capability probe against device"
run = "npm run probe"

[tasks.profile]
description = "Cache the device capability profile (ListMethods + components) for Tier 4 lint"
run = "npm run profile"

[tasks.clean]
description = "Remove Shelly + web build artifacts"
run = "rm -rf dist web/dist .tsc-out"
