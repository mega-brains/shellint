[tools]
node = "24"

[env]
# Overrides, not the source of truth: txiki-test-util.mjs pins the version and
# falls back to vendor/txiki/tjs, so `npm run …` works without mise. Path is
# repo-relative and gitignored; `mise run vendor:txiki` fills it.
SHELLINT_TJS_VERSION = "26.6.0"
SHELLINT_TJS_BIN = "vendor/txiki/tjs"

[tasks.install]
description = "Install npm dependencies"
run = "npm install"

[tasks.start]
description = "Start shellint server (host/port from shellint.json)"
alias = "dev"
run = "npm run dev"

[tasks."build:shelly"]
description = "Build Shelly dual artifacts"
run = "npm run build:shelly"

[tasks."build:web"]
description = "Build web UI bundle"
run = "npm run build:web"

[tasks."vendor:txiki"]
description = "Fetch/verify the pinned txiki.js binary in gitignored vendor/txiki (SHELLINT_TJS_BIN); --force refetches, --check verifies without network"
run = "npm run vendor:txiki -- \"$@\""

[tasks."build:txiki"]
description = "Build txiki server and CLI bundles"
depends = "vendor:txiki"
run = "npm run build:txiki"

[tasks."build:txiki:executable"]
description = "Build standalone txiki server executable"
depends = "vendor:txiki"
run = "npm run build:txiki:executable"

[tasks.build]
description = "oxlint project source + build Shelly dual artifacts + web UI bundle (parallel)"
depends = ["oxlint", "build:shelly", "build:web"]

[tasks."build:shelly:fixture"]
description = "Build the device fixture (fixtures/device/main.ts) into its own scratch dist — the gate's device build"
run = "npm run build:shelly:fixture"

[tasks."build:gate"]
description = "oxlint + fixture device build + web UI bundle — the build step of beforeCommit, independent of scripts/main.ts"
depends = ["oxlint", "build:shelly:fixture", "build:web"]

[tasks."build:static"]
description = "Build the GitHub Pages site into site/: landing + download at the root, the offline/device-less app under site/demo/ (M17, M26)"
alias = "build:site"
run = "npm run build:static"

[tasks."preview:static"]
description = "Serve site/ with a plain static file server — / landing, /demo/ app, /download.html; proves build:static needs no server (M17, M26)"
alias = "preview:site"
depends = "build:static"
run = "npm run preview:static -- \"$@\""

[tasks."start:txiki"]
description = "Start bundled txiki server"
depends = "build:txiki"
run = "npm run start:txiki"

[tasks.deploy]
description = "Build then deploy (MODE=debug|prod, MINIFY=min|raw)"
# Usage: mise run deploy -- debug min   OR   MODE=prod MINIFY=raw mise run deploy
run = """
mode="${1:-${MODE:-debug}}"
minify="${2:-${MINIFY:-min}}"
npm run build:shelly
npm run deploy -- --mode "$mode" --minify "$minify"
"""

[tasks."deploy:txiki"]
description = "Build and deploy through txiki"
run = "npm run deploy:txiki -- \"$@\""

[tasks.oxlint]
description = "oxlint over shellint's own source (server/web/scripts/shared/e2e) — never Shelly device code, which server/lint/ covers"
run = "npm run oxlint"

[tasks.lint]
description = "Typecheck Shelly script + server + web"
depends = ["typecheck"]

[tasks."typecheck:shelly"]
description = "Typecheck the device fixture (fixtures/device/main.ts) under the device compiler options"
run = "npm run typecheck:shelly"

[tasks."typecheck:script"]
description = "Typecheck your live scripts/main.ts — deliberately outside the gate"
run = "npm run typecheck:script"

[tasks."typecheck:server"]
description = "Typecheck server"
run = "npm run typecheck:server"

[tasks."typecheck:web"]
description = "Typecheck web"
run = "npm run typecheck:web"

[tasks.typecheck]
description = "Typecheck Shelly script + server + web (parallel)"
depends = ["typecheck:shelly", "typecheck:server", "typecheck:web"]

[tasks."check:lines"]
description = "Fail if any .ts/.tsx/.js/.mjs/.mts/.css source exceeds 500 lines"
run = "npm run check:lines"

[tasks.bench]
description = "Minify option benchmark over bench/*.ts (+ main.ts as reference)"
# Usage: mise run bench   OR   mise run bench -- log-heavy   OR   mise run bench -- --json
run = "npm run bench -- \"$@\""

[tasks.test]
description = "Shelly DCE/minify asserts + web bundle + server smoke"
run = "npm run test"

[tasks."test:e2e"]
description = "Playwright e2e (Chromium) against local shellint UI"
run = "npm run test:e2e"

[tasks."test:e2e:txiki"]
description = "Playwright e2e against the txiki single-file executable"
run = "npm run test:e2e:txiki"

[tasks."test:e2e:lightpanda"]
description = "Playwright e2e against the Lightpanda browser (partial: no layout, no screenshots — see e2e/playwright.lightpanda.config.ts)"
run = "npm run test:e2e:lightpanda"

[tasks."test:e2e:hybrid"]
description = "Full e2e coverage split across Lightpanda shards + Chromium (measured slower than test:e2e — see scripts/e2e-hybrid.mjs)"
run = "npm run test:e2e:hybrid -- \"$@\""

[tasks."test:txiki"]
description = "Typecheck and verify txiki parity"
run = "npm run test:txiki"

[tasks.b]
alias="beforeCommit"
description = "Pre-commit gate: oxlint + line limit + typecheck + fixture build run in parallel, then static build, test, then e2e on Node and on the txiki executable"
depends = ["oxlint", "check:lines", "typecheck", "build:gate"]
run = """
npm run build:static
npm run test && npm run test:e2e && npm run test:e2e:txiki
"""

[tasks.probe]
description = "Run Script.Eval capability probe against device"
run = "npm run probe"

[tasks."probe:txiki"]
description = "Run capability probe through txiki"
run = "npm run probe:txiki"

[tasks.profile]
description = "Cache the device capability profile (ListMethods + components) for Tier 4 lint"
run = "npm run profile"

[tasks."profile:txiki"]
description = "Cache device profile through txiki"
run = "npm run profile:txiki"

[tasks.clean]
description = "Remove Shelly + web build artifacts"
run = "npm run clean"
