<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shelly DevRoom</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-row">
        <h1>Shelly DevRoom</h1>
        <p class="sub" id="configLine">loading config…</p>
      </div>
    </header>

    <main>
      <div class="toolbar">
        <button
          type="button"
          id="btnSave"
          title="Save editor contents to scripts/main.ts"
        >
          Save
        </button>
        <button
          type="button"
          id="btnBuild"
          title="Compile TypeScript to ES5 and emit debug/prod raw + minified artifacts under dist/"
        >
          Build
        </button>
        <div class="split" id="deploySplit">
          <button
            type="button"
            id="btnDeploy"
            title="Upload the selected build (debug · min) to the Shelly script slot over WebSocket RPC"
          >
            Deploy debug · min
          </button>
          <button
            type="button"
            id="btnDeployMenu"
            class="split-toggle"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="deployMenu"
            title="Choose debug/prod and minified/non-minified, then deploy"
          >
            ▾
          </button>
          <ul class="menu" id="deployMenu" role="menu" hidden>
            <li role="none">
              <button
                type="button"
                role="menuitem"
                data-mode="debug"
                data-minify="min"
                title="Deploy dist/debug.js (meta.env.debug, minified)"
              >
                debug · minified
              </button>
            </li>
            <li role="none">
              <button
                type="button"
                role="menuitem"
                data-mode="debug"
                data-minify="raw"
                title="Deploy dist/debug.raw.js (meta.env.debug, readable / non-minified)"
              >
                debug · non-minified
              </button>
            </li>
            <li role="none">
              <button
                type="button"
                role="menuitem"
                data-mode="prod"
                data-minify="min"
                title="Deploy dist/prod.js (meta.env.prod, minified)"
              >
                prod · minified
              </button>
            </li>
            <li role="none">
              <button
                type="button"
                role="menuitem"
                data-mode="prod"
                data-minify="raw"
                title="Deploy dist/prod.raw.js (meta.env.prod, readable / non-minified)"
              >
                prod · non-minified
              </button>
            </li>
          </ul>
        </div>
        <button
          type="button"
          id="btnProbe"
          title="Run Script.Eval capability checks on the device and write types/generated-probe.json"
        >
          Probe
        </button>
      </div>

      <div id="editor" class="editor"></div>

      <div class="footer">
        <section class="sizes" aria-label="Build sizes">
          <div class="size-block">
            <h2>debug</h2>
            <p id="sizeDebug">—</p>
          </div>
          <div class="size-block">
            <h2>prod</h2>
            <p id="sizeProd">—</p>
          </div>
          <div class="size-block size-stats">
            <h2>stats</h2>
            <p id="scriptStats">—</p>
          </div>
          <div class="size-block size-history">
            <h2>history</h2>
            <ol id="buildHistory" class="history-list"></ol>
          </div>
        </section>

        <section class="device" aria-label="Device telemetry" id="devicePanel">
          <div class="device-head">
            <h2>device</h2>
            <p class="device-meta" id="deviceMeta">—</p>
            <label class="eco" title="Sys.config.device.eco_mode — lower CPU clock + WiFi power-save; raises latency">
              <input type="checkbox" id="ecoToggle" disabled />
              eco
            </label>
          </div>
          <dl class="device-grid" id="deviceGrid">
            <div><dt>script</dt><dd id="dRunning">—</dd></div>
            <div><dt>mem used / peak / free</dt><dd id="dMem">—</dd></div>
            <div><dt>cpu</dt><dd id="dCpu">—</dd></div>
            <div><dt>ram free / size</dt><dd id="dRam">—</dd></div>
            <div><dt>fs free / size</dt><dd id="dFs">—</dd></div>
            <div><dt>latency</dt><dd id="dLatency">—</dd></div>
            <div><dt>temp</dt><dd id="dTemp">—</dd></div>
            <div><dt>rssi</dt><dd id="dRssi">—</dd></div>
          </dl>
          <p class="device-err" id="deviceErr" hidden></p>
        </section>

        <p class="status" id="statusLine" role="status">ready</p>
      </div>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
